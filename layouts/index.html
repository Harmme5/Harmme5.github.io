<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmme5 的主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/539468.jpg') center/cover no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
        }
        .hero {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-in;
            position: relative;
            z-index: 1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,0.3);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
        }
        .subtitle.typing {
            border-right: 2px solid white;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink {
            50% { border-color: transparent; }
        }
        .button {
            display: inline-block;
            padding: 0.8rem 2rem;
            margin: 0 0.5rem;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
        }
        .button:hover {
            background: rgba(255,255,255,0.3);
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .buttons {
            margin-bottom: 3rem;
        }
        .social {
            margin-top: 3rem;
        }
        .social a {
            display: inline-block;
            margin: 0 1rem;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .social a:hover {
            opacity: 1;
        }
        .sakura {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            background: radial-gradient(ellipse at center, #ffb7c5 0%, #ff9db8 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.7;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) translateX(-100px) rotate(720deg);
                opacity: 0;
            }
        }
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                min-height: 100svh;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 56px 18px 40px;
            }
            .hero {
                width: 100%;
                max-width: 420px;
            }
            .avatar {
                width: 96px;
                height: 96px;
                margin-bottom: 1.5rem;
            }
            h1 {
                font-size: 2.35rem;
            }
            .subtitle {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                max-width: 100%;
                white-space: normal;
            }
            .buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin-bottom: 2.2rem;
            }
            .button {
                margin: 0;
                min-height: 44px;
                min-width: 96px;
                padding: 0.75rem 1.35rem;
            }
            .social {
                margin-top: 2.2rem;
            }
            .social a {
                margin: 0 0.75rem;
                min-width: 44px;
                min-height: 44px;
                line-height: 44px;
            }
        }
        @media (max-width: 420px) {
            body {
                padding-top: 44px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="avatar">
            <img src="/head.jpg" alt="Avatar">
        </div>
        <h1>Harmme5</h1>
        <p class="subtitle">知行合一</p>
        <div class="buttons">
            <a href="/" class="button">首页</a>
            <a href="/post/" class="button">博客</a>
            <a href="/about/" class="button">关于</a>
        </div>
        <div class="social">
            <a href="https://github.com/Harmme5" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://space.bilibili.com/52415281" target="_blank" title="Bilibili"><i class="fab fa-bilibili"></i></a>
            <a href="mailto:siezh2927@163.com" title="Email"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
    <script>
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.className = 'sakura';
            sakura.style.left = Math.random() * 100 + '%';
            sakura.style.animationDuration = (Math.random() * 3 + 6) + 's';
            document.body.appendChild(sakura);
            setTimeout(() => sakura.remove(), 9000);
        }
        const sakuraInterval = window.matchMedia('(max-width: 768px)').matches ? 1200 : 400;
        setInterval(createSakura, sakuraInterval);

        // 打字机效果
        const subtitle = document.querySelector('.subtitle');
        const text = '知行合一';
        subtitle.textContent = '';
        subtitle.classList.add('typing');
        let i = 0;
        function type() {
            if (i < text.length) {
                subtitle.textContent += text[i];
                i++;
                setTimeout(type, 150);
            } else {
                subtitle.classList.remove('typing');
            }
        }
        type();
    </script>
</body>
</html>
