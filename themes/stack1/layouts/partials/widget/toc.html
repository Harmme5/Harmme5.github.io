{{ if (.Scratch.Get "hasTOC") }}
    <section class="widget archives">
        <div class="widget-icon">
            {{ partial "helper/icon" "hash" }}
        </div>
        <h2 class="widget-title section-title">{{ T "article.tableOfContents" }}</h2>

        <div class="widget--toc">
            <div class="toc-progress-bar"></div>
            {{ .TableOfContents }}
        </div>
    </section>

    <style>
    .widget--toc {
        position: relative;
        padding-left: 20px;
    }
    .widget--toc::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--card-separator-color);
        border-radius: 2px;
    }
    .toc-progress-bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 3px;
        height: 0%;
        background: var(--accent-color);
        border-radius: 2px;
        transition: height 0.3s ease;
        z-index: 1;
    }
    .widget--toc a {
        display: block;
        padding: 8px 0;
        transition: color 0.2s;
    }
    .widget--toc a.active {
        color: var(--accent-color);
        font-weight: 600;
    }
    </style>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const toc = document.querySelector('.widget--toc');
        if (!toc) return;

        const links = toc.querySelectorAll('a');
        const headings = Array.from(links).map(link => {
            const id = link.getAttribute('href').slice(1);
            return document.getElementById(id);
        }).filter(h => h);

        function updateTOC() {
            let current = -1;
            const scrollPos = window.scrollY + 100;

            for (let i = headings.length - 1; i >= 0; i--) {
                if (headings[i] && headings[i].offsetTop <= scrollPos) {
                    current = i;
                    break;
                }
            }

            links.forEach((link, i) => {
                link.classList.toggle('active', i === current);
            });

            if (current >= 0 && headings.length > 1) {
                const firstTop = headings[0].offsetTop;
                const lastTop = headings[headings.length - 1].offsetTop;
                const currentTop = headings[current].offsetTop;
                const progress = ((currentTop - firstTop) / (lastTop - firstTop)) * 100;
                const bar = document.querySelector('.toc-progress-bar');
                if (bar) bar.style.height = Math.min(Math.max(progress, 0), 100) + '%';
            }
        }

        window.addEventListener('scroll', updateTOC, { passive: true });
        updateTOC();
    });
    </script>
{{ end }}
