<script>

document.addEventListener('DOMContentLoaded', function() {
    
    const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
    const observer = new IntersectionObserver(function(entries) {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('fade-in');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.querySelectorAll('.article-list--compact article, .article-list--tile .article-list__item').forEach(el => {
        observer.observe(el);
    });

    const progressBar = document.createElement('div');
    progressBar.className = 'reading-progress-bar';
    document.body.appendChild(progressBar);

    function updateReadingProgress() {
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;
        const scrollTop = window.scrollY;
        const scrollPercent = (scrollTop / (documentHeight - windowHeight)) * 100;
        progressBar.style.width = Math.min(scrollPercent, 100) + '%';
    }

    window.addEventListener('scroll', updateReadingProgress, { passive: true });
    updateReadingProgress();
});


document.addEventListener('DOMContentLoaded', function() {
    
    document.querySelectorAll('.article-list--compact article').forEach(function(article) {
        article.addEventListener('click', function(e) {
            if (e.target.closest('a')) return;

            const url = article.dataset.url;
            if (url) {
                window.location.href = url;
            }
        });
    });

});


document.addEventListener('DOMContentLoaded', function() {
    const backToTop = document.createElement('div');
    backToTop.className = 'back-to-top';
    backToTop.innerHTML = '↑';
    backToTop.title = '回到顶部';
    document.body.appendChild(backToTop);

    window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
            backToTop.classList.add('show');
        } else {
            backToTop.classList.remove('show');
        }
    }, { passive: true });

    backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
});


document.addEventListener('DOMContentLoaded', function() {
    
    const lightbox = document.createElement('div');
    lightbox.className = 'lightbox-overlay';
    document.body.appendChild(lightbox);

    
    lightbox.addEventListener('click', function() {
        this.classList.remove('active');
        this.innerHTML = '';
    });

    
    const articleImages = document.querySelectorAll('.article-content img, .article-page img');
    articleImages.forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const clonedImg = this.cloneNode(true);
            clonedImg.style.cursor = 'zoom-out';
            lightbox.innerHTML = '';
            lightbox.appendChild(clonedImg);
            lightbox.classList.add('active');
        });
    });
});


document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (link && link.querySelector('img')) {
        e.preventDefault();
        return false;
    }

    
    if (e.target.closest('.widget--toc a')) return;

    const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff9ff3'];
    const particleCount = 12;

    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.5;
        const velocity = 25 + Math.random() * 20;
        const size = 4 + Math.random() * 6;

        particle.style.cssText = `
            position: fixed;
            left: ${e.clientX}px;
            top: ${e.clientY}px;
            width: ${size}px;
            height: ${size}px;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        `;

        document.body.appendChild(particle);

        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;

        let progress = 0;
        const animate = () => {
            progress += 0.005;
            if (progress >= 1) {
                particle.remove();
                return;
            }

            const easeOut = 1 - Math.pow(1 - progress, 3);
            const easeIn = progress < 0.5 ? easeOut : 1 - Math.pow((progress - 0.5) * 2, 2);

            const x = progress < 0.5 ? tx * easeOut : tx * (1 - (progress - 0.5) * 2);
            const y = progress < 0.5 ? ty * easeOut : ty * (1 - (progress - 0.5) * 2);
            const opacity = progress < 0.5 ? 1 : 1 - (progress - 0.5) * 2;

            particle.style.transform = `translate(${x}px, ${y}px)`;
            particle.style.opacity = opacity;

            requestAnimationFrame(animate);
        };
        animate();
    }
});


document.addEventListener('DOMContentLoaded', function() {
    const toc = document.querySelector('.widget--toc');
    if (!toc) return;

    
    const progressBar = document.createElement('div');
    progressBar.className = 'toc-progress-bar';
    toc.insertBefore(progressBar, toc.firstChild);

    const links = toc.querySelectorAll('a');
    const headings = Array.from(links).map(link => {
        const id = link.getAttribute('href').slice(1);
        return document.getElementById(id);
    }).filter(h => h);

    function updateTOC() {
        let current = -1;
        const scrollPos = window.scrollY + window.innerHeight / 3;

        for (let i = headings.length - 1; i >= 0; i--) {
            if (headings[i] && headings[i].offsetTop <= scrollPos) {
                current = i;
                break;
            }
        }

        links.forEach((link, i) => {
            link.classList.toggle('active', i === current);
        });

        if (current >= 0 && links.length > 1) {
            const linkElement = links[current];
            const linkTop = linkElement.offsetTop;
            const firstLinkTop = links[0].offsetTop;
            const lastLinkTop = links[links.length - 1].offsetTop;
            const progress = ((linkTop - firstLinkTop) / (lastLinkTop - firstLinkTop)) * 100;
            progressBar.style.height = Math.min(Math.max(progress, 0), 100) + '%';
        }
    }

    
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const id = this.getAttribute('href').slice(1);
            const target = document.getElementById(id);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });

    window.addEventListener('scroll', updateTOC, { passive: true });
    updateTOC();
});
</script>
