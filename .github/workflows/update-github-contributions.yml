name: Update GitHub contributions

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN || github.token }}
          GITHUB_USER: Harmme5
        run: node scripts/fetch-github-contributions.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- static/data/github-contributions.json; then
            echo "No contribution data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/github-contributions.json
          git commit -m "Update GitHub contributions data"
          git push
